  <g id="text_3">
   <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #233746" x="34.56" y="87.552" transform="rotate(-0 34.56 87.552)">Volatility and spreads in competitive market making</text>
  </g>
  <g id="text_4">
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586976" x="34.56" y="123.12" transform="rotate(-0 34.56 123.12)">Theoretical mechanism • at least two strategic market makers</text>
  </g>
  <g id="text_5">
   <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #586976" transform="translate(34.56 503.930275)">Source: Onger &amp; Foscari, arXiv:2610.30891v1, submitted October 22, 2026.</text>
   <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #586976" transform="translate(34.56 523.6704)">Illustrative and uncalibrated. Model assumptions do not identify an executable spread.</text>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #197d96" x="58.752" y="209.452875" transform="rotate(-0 58.752 209.452875)">HIGHER VOLATILITY</text>
  </g>
  <g id="text_7">
   <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(58.752 247.756875)">Greater uncertainty in</text>
   <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(58.752 273.191875)">underlying asset value</text>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #be8c35" x="525.312" y="209.452875" transform="rotate(-0 525.312 209.452875)">WIDER SPREAD</text>
  </g>
  <g id="text_9">
   <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(525.312 247.756875)">Strict widening at</text>
   <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(525.312 273.191875)">model equilibrium</text>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #197d96" x="58.752" y="373.612875" transform="rotate(-0 58.752 373.612875)">LEARNING RESULT — ADDITIONAL ASSUMPTIONS</text>
  </g>
  <g id="text_11">
   <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(58.752 411.916875)">As ticks shrink, no-internal-regret learning</text>
   <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(58.752 437.351875)">approaches the Nash price envelope.</text>

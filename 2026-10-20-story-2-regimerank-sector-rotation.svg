   <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #233746" x="34.56" y="87.552" transform="rotate(-0 34.56 87.552)">RegimeRank: inputs, conditioning and sector ranking</text>
  </g>
  <g id="text_4">
   <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586976" x="34.56" y="123.12" transform="rotate(-0 34.56 123.12)">October 19, 2026 research • Conceptual architecture, not a return forecast</text>
  </g>
  <g id="text_5">
   <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #586976" transform="translate(34.56 498.235719)">Source: Koa et al., arXiv:2610.26456v1, Oct 19, 2026.</text>
   <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #586976" transform="translate(34.56 517.104)">Weekly 2002–2024 data; forward labels reduce usable end dates. Ranking gains ≠ net returns.</text>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #197d96" x="50.112" y="203.221031" transform="rotate(-0 50.112 203.221031)">SIGNAL FEATURES</text>
  </g>
  <g id="text_7">
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(50.112 240.765187)">Fundamental + technical</text>
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(50.112 265.024406)">Temporal characteristics</text>
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(50.112 289.283625)">Conditioned on</text>
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(50.112 313.542844)">learned macro factors</text>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #197d96" x="324" y="203.221031" transform="rotate(-0 324 203.221031)">SECTOR RELATIONS</text>
  </g>
  <g id="text_9">
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(324 240.765187)">Cross-sector attention</text>
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(324 265.024406)">Information shared</text>
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(324 289.283625)">across related sectors</text>
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(324 313.542844)">Attribution diagnostics</text>
  </g>
  <g id="text_10">

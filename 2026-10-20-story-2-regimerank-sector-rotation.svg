   <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(597.888 265.024406)">52-week labels</text>
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(597.888 289.283625)">Purging + embargo</text>
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(597.888 313.542844)">Few independent periods</text>
  </g>

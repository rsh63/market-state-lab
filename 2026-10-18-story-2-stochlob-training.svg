  <g id="text_3">
   <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #233746" x="34.56" y="87.552" transform="rotate(-0 34.56 87.552)">StochLOB: training noise and deterministic inference</text>
  </g>
  <g id="text_4">
   <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586976" x="34.56" y="123.12" transform="rotate(-0 34.56 123.12)">October 15, 2026 arXiv preprint • Conceptual method map</text>
  </g>
  <g id="text_5">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #586976" transform="translate(34.56 499.583453)">Source: Abolghasemi et al., arXiv:2610.21081v1, submitted Oct 15, 2026.</text>
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #586976" transform="translate(34.56 517.104)">Illustrative architecture, not a calibrated timeline or performance comparison.</text>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #197d96" x="50.112" y="205.197188" transform="rotate(-0 50.112 205.197188)">TRAINING NOISE</text>
  </g>
  <g id="text_7">
   <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(50.112 242.741344)">Gaussian baseline</text>
   <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(50.112 268.032563)">versus jump-Lévy</text>
   <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(50.112 292.235781)">and clipped</text>
   <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(50.112 316.439)">alpha-stable noise</text>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #197d96" x="324" y="205.197188" transform="rotate(-0 324 205.197188)">SCORE MATCHING</text>
  </g>
  <g id="text_9">
   <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(324 242.741344)">Train on perturbed</text>
   <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(324 266.944563)">order-book data</text>
   <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(324 291.147781)">Keep chronological</text>
   <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(324 315.351)">held-out tests</text>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #197d96" x="597.888" y="205.197188" transform="rotate(-0 597.888 205.197188)">DEPLOYMENT</text>
  </g>
  <g id="text_11">
   <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(597.888 242.741344)">Deterministic predictor</text>
   <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(597.888 266.944563)">No reverse-time</text>
   <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(597.888 291.147781)">diffusion sampling</text>
   <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #233746" transform="translate(597.888 315.351)">at inference</text>
  </g>
  <g id="text_12">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #233746" x="34.56" y="432.288" transform="rotate(-0 34.56 432.288)">Trading test: calibration + tail losses + costs + market-rule constraints.</text>
  </g>
